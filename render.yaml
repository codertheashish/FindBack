services:
  - type: web
    name: findback-portal
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /
    disk:
      name: findback-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_PATH
        value: /var/data/findback.sqlite
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: CAPTCHA_PROVIDER
        value: checkbox
      - key: SEED_ADMIN_USERNAME
        value: codertheashish
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
