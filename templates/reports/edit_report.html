{% extends "base.html" %}
{% block title %}Edit Report – FindBack{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center"><div class="col-lg-8">
        <div class="card border-0 shadow-sm p-4 bg-white rounded-3">
            <h3 class="fw-bold text-dark mb-3">Edit {{ report.report_type }} report #{{ report.id }}</h3>
            <form method="POST" action="{{ url_for('reports.edit_report', report_id=report.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row g-3">
                    <div class="col-md-8"><label class="form-label fw-semibold small">Item name *</label>
                        <input class="form-control" name="item_name" required maxlength="120" value="{{ form.item_name or '' }}"></div>
                    <div class="col-md-4"><label class="form-label fw-semibold small">Category *</label>
                        <select class="form-select" name="category" required>
                            {% for cat in categories %}<option value="{{ cat }}" {% if form.category == cat %}selected{% endif %}>{{ cat }}</option>{% endfor %}
                        </select></div>
                    <div class="col-12"><label class="form-label fw-semibold small">Public description *</label>
                        <textarea class="form-control" name="description" rows="3" required maxlength="2000">{{ form.description or '' }}</textarea></div>
                    <div class="col-md-6"><label class="form-label fw-semibold small">Date *</label>
                        <input type="date" class="form-control" name="date_occurred" required value="{{ form.date_occurred or '' }}"></div>
                    <div class="col-md-6"><label class="form-label fw-semibold small">Location *</label>
                        <input class="form-control" name="location" required maxlength="200" value="{{ form.location or '' }}"></div>
                    <div class="col-12"><label class="form-label fw-semibold small">Distinguishing characteristics (private)</label>
                        <textarea class="form-control" name="distinguishing_features" rows="2" maxlength="1000">{{ form.distinguishing_features or '' }}</textarea></div>
                    <div class="col-12"><label class="form-label fw-semibold small">Private contact</label>
                        <input class="form-control" name="private_contact" maxlength="150" value="{{ form.private_contact or '' }}"></div>
                    <div class="col-12 pt-2"><button class="btn btn-primary px-4 fw-semibold" type="submit">Save changes</button>
                        <a class="btn btn-light border ms-2" href="{{ url_for('reports.detail', report_id=report.id) }}">Cancel</a></div>
                </div>
            </form>
        </div>
    </div></div>
</div>
{% endblock %}
