{% extends "base.html" %}

{% block title %}Page Not Found – FindBack{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-3 fw-bold text-dark font-monospace">404</h1>
        <h4 class="fw-semibold text-secondary mb-3">Item or Page Not Found</h4>
        <p class="text-muted mb-4">The item report or verification page you are searching for might have been resolved, removed, or relocated.</p>
        <a href="{{ url_for('reports.browse') }}" class="btn btn-primary px-4 py-2">Return to Catalog</a>
    </div>
</div>
{% endblock %}
